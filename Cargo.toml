[package]
name = "wolf3d-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust and SDL2 migration of the original Wolfenstein 3D source release"
license-file = "WOLFSRC/README/LICENSE.DOC"

[dependencies]
hqx = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xbrz-rs = "0.1.0"

[[bin]]
name = "wolf3d"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
